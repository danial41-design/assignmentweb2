<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form</title>
    <link rel="stylesheet" href="C:\Users\aser\Desktop\assignemntform.css">
    <script defer>
        document.addEventListener('DOMContentLoaded', function () {
            const bodyf = document.getElementById('formo');
            const form = document.getElementById('orderForm');
            const errorMessages = document.getElementById('errorMessages');

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                errorMessages.innerHTML = '';
                bodyf.style.backgroundColor = '';

                let valid = true;
                let errors = [];

                const address = document.getElementById('Address').value.trim();
                if (!address) {
                    valid = false;
                    bodyf.style.backgroundColor = '#ffcccc';
                    errors.push(' Адрес не может быть пустым.');
                }

                const amount = parseInt(document.getElementById('Amount').value.trim());
                if (isNaN(amount) || amount <= 0) {
                    valid = false;
                    bodyf.style.backgroundColor = '#ffcccc';
                    errors.push(' Введите количество больше 0.');
                }

                if (!valid) {
                    errorMessages.innerHTML = `<ul style="color:red; font-weight:bold;"><li>${errors.join('</li><li>')}</li></ul>`;
                } else {
                    alert(' Форма успешно отправлена!');
                    form.submit();
                }
            });


            const questions = document.querySelectorAll('.faq-question');
            questions.forEach(question => {
                question.addEventListener('click', function () {
                    const answer = this.nextElementSibling;  
                    answer.classList.toggle('show'); 
                });
            });
        });
    </script>
</head>

<body>
    <div id="formo">
        <form id="orderForm" action="donate" method="POST" novalidate>
            <label for="Address">Введите адрес:</label>
            <input type="text" id="Address" name="Address" placeholder="Введите адрес">

            <label for="Amount">Введите количество:</label>
            <input type="number" id="Amount" name="Amount" placeholder="Введите количество">

            <input type="submit" value="Заказать">
        </form>
        <div id="errorMessages"></div>
    </div>
    
    <footer>
        <div class="faq-section">
            <div class="faq-question">Сколько времени займет доставка?</div>
            <div class="faq-answer">
                Доставка займет от 30-50 минут в зависимости от местоположений.
            </div>
    
            <div class="faq-question">Доставит ли курьер до двери?</div>
            <div class="faq-answer">
                Да, наш курьер доставит заказ прямо до двери по указанному адресу.
            </div>
        </div>
    </footer>
</body>

</html>
